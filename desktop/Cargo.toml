[package]
name = "claude-monitor-desktop"
version = "0.1.0"
edition = "2021"
description = "A window around the Claude Monitor live board; it holds no logic of its own"
license = "MIT"
publish = false

[lib]
name = "claude_monitor_desktop"
path = "src/lib.rs"

[[bin]]
name = "claude-monitor-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
