# CI runs the SAME gate as a local run: scripts/gate-core.sh, with the thresholds in
# scripts/merge-gate.conf — never a second set of rules in this file (rule #19).
# .NET 10 for the API and the agent (ADR-0002); Node and the e2e browsers arrive with the web app.
# Locally: bash scripts/merge-gate.sh dev
name: CI

on:
  push:
    branches: [dev, test, prod]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to a full commit SHA (the tag is in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the secret scan reads the history

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      # The API and the agent (.NET 10). The API's tests start PostgreSQL 18 in Docker, which the runner has.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: CodeQL CLI
        id: codeql
        uses: github/codeql-action/setup-codeql@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3

      - name: Put the CodeQL CLI on PATH
        env:
          CODEQL_BIN: ${{ steps.codeql.outputs.codeql-path }}
        run: dirname "$CODEQL_BIN" >> "$GITHUB_PATH"

      - name: gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz

      - name: Tool versions
        run: |
          python3 --version
          dotnet --version
          docker version --format '{{.Server.Version}}'
          gitleaks version
          codeql version | head -1
          shellcheck --version | sed -n 2p

      - name: Identity for the tests that make commits in temporary repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"

      - name: Gate
        run: bash scripts/gate-core.sh dev

