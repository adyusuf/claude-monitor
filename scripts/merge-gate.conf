# Settings for the shared gate core (scripts/gate-core.sh) — values are THIS repository's.
# No COVERAGE_MIN here: a project keeps no coverage setting of its own (standards/13 section 8a). coverage.sh and
# the gate both default to 80; where coverage runs is the panel's coverage_before_push.<target>.
COVERAGE_CMD="bash scripts/coverage.sh"
SAST_CMD="bash scripts/codeql-scan.sh"
# The API, the agent protocol and the database only grow (global #4); compared with the branch being promoted into.
BACKCOMPAT_CMD="python3 scripts/backcompat_scan.py --base origin/${TARGET:-dev}"

# ONE test run feeds both steps. The shared core's "unit tests" step runs the same commands as always (dotnet test <sln>,
# the web tests) and stays what it was: green means the tests are green. These variables make that run COLLECT line
# coverage as it goes — tests/coverage.props for the .NET test projects, web/vite.config.ts for vitest, both keyed on
# COVERAGE_DIR — and the "coverage" step (scripts/coverage.sh, COVERAGE_REUSE=1) then judges the files instead of running
# every test again. The threshold, the exclusion lists and the exit codes are unchanged (#29): a missing or unreadable
# result is NOT MEASURED, which blocks. A fresh directory per run, so a stale result can never be read; `--list`, the prod gate
# and `--coverage-only` (no unit-test step runs, so there would be nothing to judge) make none: coverage.sh then runs the tests itself.
# (The core's header documents UNIT_CMD but this copy does not read it, so the collection is switched on through the
# environment, which the commands it already runs pick up.)
if [ "${LIST_ONLY:-0}" != 1 ] && [ "${COVERAGE_ONLY:-0}" != 1 ] && [ "${TARGET:-}" != prod ]; then
  COVERAGE_DIR="$(mktemp -d "${TMPDIR:-/tmp}/ap-coverage.XXXXXX")"
  COVERAGE_REUSE=1
  COVERAGE_DIR_OWNED=1
  export COVERAGE_DIR COVERAGE_REUSE COVERAGE_DIR_OWNED
fi

# No accepted gap: coverage, SAST, the backward-compatibility scan and the e2e suite are all measured and block.
# The prod gate's e2e RUN is not covered by this pattern: it stays skipped, so prod is not green without e2e.
# Coverage and SAST are NOT in this list: both are measured and both block.
#
# Rule #9 (no file over 300 lines) applies to this repository's own code. The files copied here from the
# configuration repository's canonical set (gate-core.sh, md-rule-gate.py, md-split.py, ...) are exempt:
# they are twins, changed only upstream and then copied, and splitting a copy would make it drift.

# e2e (Playwright, e2e/) is optional (#33): the prod gate runs it only with GATE_RUN_E2E=1, against E2E_BASE_URL (the
# test environment) when it is set, otherwise against a local stack e2e/serve-local.sh starts.
E2E_WEB_CMD="cd e2e && npm ci --silent && npx playwright install chromium webkit && npx playwright test"
# Deploy verification, only with GATE_CHECK_TEST_DEPLOY=1 (#33: since 04/10/2026 the prod gate does not check the test
# environment by default): the test environment's /api/version must report this commit. Its address comes from the
# environment (E2E_BASE_URL), never from this public file. Without a test environment the suite builds and runs this
# very commit locally (e2e/serve-local.sh), so the commit to verify is HEAD itself.
if [ -n "${E2E_BASE_URL:-}" ]; then
  TEST_VERSION_URL="${E2E_BASE_URL%/}/api/version"
else
  TEST_DEPLOY_SHA_CMD="git rev-parse HEAD"
fi
