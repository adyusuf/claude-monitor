# Settings for the shared gate core (scripts/gate-core.sh) — values are THIS repository's.
COVERAGE_MIN=80
COVERAGE_CMD="bash scripts/coverage.sh"
# The Rust dependency audit (desktop/Cargo.lock) rides on this step: the shared core has no
# Rust CVE step, so scripts/cargo-audit.sh runs beside SAST and the worse of the two exit codes
# (3 NOT RUN > 1 finding > 0) is the step's. It moves into the core when the core learns Rust.
SAST_CMD="bash scripts/codeql-scan.sh; sast=\$?; bash scripts/cargo-audit.sh; audit=\$?; exit \$(( sast > audit ? sast : audit ))"

# Three gaps are accepted, and none of them is a deferral — each is inapplicable here:
#   backward-compatibility scan — there is no API contract to evolve additively: the server
#     answers a page and a same-origin JSON the page itself reads, on 127.0.0.1 only.
#   e2e spec check / prod e2e — the application is a local tool with no deployed test
#     environment. Its behaviour is covered by the unit tests (Python and Node), measured
#     per codebase by scripts/coverage.sh.
# Coverage and SAST are NOT in this list: both are measured and both block.
#
# Rule #9 (no file over 300 lines) applies to this repository's own code. The files copied here from the
# configuration repository's canonical set (gate-core.sh, md-rule-gate.py, md-split.py, ...) are exempt:
# they are twins, changed only upstream and then copied, and splitting a copy would make it drift.
ACCEPTED_GAPS="backward-compatibility scan"
ACCEPTED_GAPS_REASON="a local tool with no public API contract: nothing for the backward-compatibility scan to read. Coverage, SAST and the browser tests (e2e/) are measured and block. The promotion itself stays the maintainer's decision."

# The browser tests (Playwright, e2e/): run by the test -> prod gate only (#33). There is no deployed test
# environment for a local tool, so e2e/serve.py starts a real board server on a seeded temporary project.
E2E_WEB_CMD="cd e2e && npm ci --silent && npx playwright install chromium webkit && npx playwright test"

TEST_DEPLOY_SHA_CMD="git ls-remote origin refs/heads/test"
