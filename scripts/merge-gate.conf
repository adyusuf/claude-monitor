# Settings for the shared gate core (scripts/gate-core.sh) — values are THIS repository's.
COVERAGE_MIN=80
COVERAGE_CMD="bash scripts/coverage.sh"
SAST_CMD="bash scripts/codeql-scan.sh"
# The API, the agent protocol and the database only grow (global #4); compared with the branch being promoted into.
BACKCOMPAT_CMD="python3 scripts/backcompat_scan.py --base origin/${TARGET:-dev}"

# No accepted gap: coverage, SAST, the backward-compatibility scan and the e2e suite are all measured and block.
# The prod gate's e2e RUN is not covered by this pattern: it stays skipped, so prod is not green without e2e.
# Coverage and SAST are NOT in this list: both are measured and both block.
#
# Rule #9 (no file over 300 lines) applies to this repository's own code. The files copied here from the
# configuration repository's canonical set (gate-core.sh, md-rule-gate.py, md-split.py, ...) are exempt:
# they are twins, changed only upstream and then copied, and splitting a copy would make it drift.

# e2e (Playwright, e2e/) runs at the test -> prod gate only (#33): against E2E_BASE_URL (the test environment) when it
# is set, otherwise against a local stack e2e/serve-local.sh starts (the "no test environment" fallback).
E2E_WEB_CMD="cd e2e && npm ci --silent && npx playwright install chromium webkit && npx playwright test"
TEST_DEPLOY_SHA_CMD="git ls-remote origin refs/heads/test"
