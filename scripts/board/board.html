<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Monitor</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--muted:#6b6a66;--line:#e4e3de;--chip:#f0efea;
--run:#2f6fdb;--run-bg:#e8f0fd;--ok:#1f8a4c;--ok-bg:#e5f5ec;--warn:#a86400;--warn-bg:#fdf1dc;
--bad:#c23a2b;--bad-bg:#fbe7e4;--off:#8a8983;--code:#9a3a2a;--code-bg:#f6ece9}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1d;--ink:#ecebe6;--muted:#9c9b95;
--line:#34332f;--chip:#2a2a27;--run:#7aa7f5;--run-bg:#1d2a42;--ok:#5cc58a;--ok-bg:#16301f;--warn:#e0a64a;
--warn-bg:#35280f;--bad:#f08070;--bad-bg:#3a1b17;--off:#77766f;--code:#f0a090;--code-bg:#33211d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
h1{font-size:19px;margin:0;font-weight:650}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.pill{padding:2px 9px;border-radius:999px;background:var(--chip);font-size:12px;color:var(--muted)}
.pill b{color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off)}
.dot.on{background:var(--run);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.spacer{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .n{font-size:22px;font-weight:650}.stat .l{color:var(--muted);font-size:12px}
.banner{display:none;margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.banner.show{display:block}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.role{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.role.off{opacity:.55}.role .cnt{font-size:12px;color:var(--muted)}
.switch{position:relative;width:32px;height:18px;border-radius:9px;background:var(--off);border:0;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked=true]{background:var(--ok)}.switch[aria-checked=true]::after{left:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--chip)}
tr:last-child td{border-bottom:0}
tr.removed td{opacity:.45}tr.removed .title{text-decoration:line-through}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--code);background:var(--code-bg);padding:1px 5px;border-radius:4px}
.tid{color:var(--muted);font-size:12px;margin-right:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.s-planned{background:var(--chip);color:var(--muted)}.s-running,.s-starting{background:var(--run-bg);color:var(--run)}
.s-agent_done,.s-waiting{background:var(--warn-bg);color:var(--warn)}.s-done{background:var(--ok-bg);color:var(--ok)}
.s-needs_decision{background:var(--warn-bg);color:var(--warn);outline:1px solid var(--warn)}
.decide{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.dnote{flex:1;min-width:140px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--panel);color:var(--ink);font:inherit;font-size:12px}
.decided{margin-top:6px;font-size:12px;color:var(--muted)}
.s-failed,.s-denied{background:var(--bad-bg);color:var(--bad)}.s-removed{background:var(--chip);color:var(--off)}
.muted{color:var(--muted);font-size:12px}
.sname{font-weight:600;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
button.act{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
button.act:hover{border-color:var(--muted)}
.live-agents{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.agent-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--run);background:var(--run-bg);border-radius:5px;padding:1px 6px}
.agent-chip .dot{width:6px;height:6px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tab{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 11px;font:inherit;cursor:pointer}
.tab.on{border-color:var(--run);box-shadow:inset 0 0 0 1px var(--run)}
.tab .cnt{font-size:12px;color:var(--muted)}
.mg{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--off);white-space:nowrap}
.mg.on{background:var(--ok-bg);color:var(--ok)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.err{color:var(--bad);font-size:12px}
.st-busy{background:var(--run-bg);color:var(--run)}.st-idle,.st-unknown{background:var(--chip);color:var(--muted)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.ch{background:var(--ok-bg);color:var(--ok)}
.chk{font-size:13px;color:var(--muted);display:inline-block;margin:0 2px 6px}
.send{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.send select{max-width:190px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;background:var(--panel);color:var(--ink);font:inherit;font-size:12px}
.modes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
button.mode.on{border-color:var(--run);color:var(--run);font-weight:650}
tr.total td{background:var(--chip);border-top:1px solid var(--line)}
.help{font-size:12px;color:var(--muted);margin:6px 2px 0}.help p{margin:3px 0}
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title"></h1>
    <span class="pill"><span data-i18n="mode"></span> <b id="mode">–</b></span>
    <span class="pill live"><span class="dot" id="dot"></span><span id="turn"></span></span>
    <span class="spacer"></span>
    <span class="muted"><span data-i18n="lastEvent"></span> <span id="last">–</span></span>
    <span class="err" id="err"></span>
    <button class="act" id="lang" type="button"></button>
  </header>

  <nav class="tabs" id="projects" aria-label="projects"></nav>
  <div class="modes" id="modes"></div>

  <div class="stats" id="stats"></div>
  <div class="banner" id="banner" data-i18n="allDone"></div>

  <h2 data-i18n="agentsHdr"></h2>
  <div class="roles" id="roles"></div>

  <h2 data-i18n="sessionsHdr"></h2>
  <label class="chk"><input type="checkbox" id="channelOnly"> <span data-i18n="channelOnly"></span></label>
  <div class="card"><table>
    <thead><tr><th data-i18n="colSession"></th><th data-i18n="colStatus"></th><th data-i18n="colContext"></th>
      <th data-i18n="colCost"></th><th data-i18n="colRate"></th><th data-i18n="colProjection"></th><th data-i18n="colSend"></th></tr></thead>
    <tbody id="sessions"></tbody>
  </table></div>
  <div class="help" id="sessionsHelp"></div>

  <h2 data-i18n="tasksHdr"></h2>
  <div class="card"><table>
    <thead><tr><th data-i18n="colTask"></th><th data-i18n="colBranch"></th><th data-i18n="colRole"></th>
      <th data-i18n="colStatus"></th><th data-i18n="colTime"></th><th data-i18n="colMerge"></th><th data-i18n="colCostEta"></th><th data-i18n="colNote"></th><th></th></tr></thead>
    <tbody id="tasks"></tbody>
  </table></div>

  <h2 data-i18n="activityHdr"></h2>
  <div class="card"><table>
    <thead><tr><th data-i18n="colAgent"></th><th data-i18n="colTask"></th><th data-i18n="colStatus"></th>
      <th data-i18n="colStarted"></th><th data-i18n="colTime"></th><th data-i18n="colTokens"></th>
      <th data-i18n="colCost"></th><th data-i18n="colNote"></th></tr></thead>
    <tbody id="agents"></tbody>
  </table></div>
  <div class="help" id="agentsHelp"></div>
</main>
<script src="board_ui_text.js"></script>
<script src="board_ui_sessions.js"></script>
<script src="board_ui.js"></script>
</body>
</html>
